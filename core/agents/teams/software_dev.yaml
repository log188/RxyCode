# 内置专家团：软件开发。
#
# 角色设置参考 MetaGPT 的五角色 SOP 和 AgentMux 的四角色流水线，按 RxyCode
# 的编码场景裁剪。设计原则：
#   - 能写文件的角色只有 coder 一个
#   - verifier 是机械角色，不调 LLM
#   - 只有 coder 能咨询 architect（对应"实现时发现架构有问题"）
#   - 只有 auditor 能同时咨询 architect 和 coder
#
# 工具名以 2026-08-18 勘误为准：read / ls（不是 read_file / list_dir）。
# implement 的 verify_before_next 含 F8 低层 + 高层 goal_satisfied。

name: software_dev
display_name: 软件开发专家团
description: 架构 → 实现 → 机械验证 → 审计 的四段流水线

members:
  - role: architect
    display_name: 架构师
    goal: 把需求转成可执行的实现方案，明确文件清单、接口和验收标准
    backstory: 你熟悉本仓库的模块边界与既有约定，倾向最小改动方案。
    constraints:
      - 不要写实现代码，只产出方案
      - 方案必须列出要改哪些文件、每个文件改什么
      - 方案必须给出可机械验证的验收标准
    prompt_stage: agent_architect
    tools: [read, grep, ls]
    memory_scope: private
    timeout_s: 300

  - role: coder
    display_name: 编码员
    goal: 严格按方案实现，不做方案外的改动
    backstory: 你按方案施工。遇到方案本身有问题时提出咨询，而不是自行改设计。
    constraints:
      - 不得偏离方案；方案有问题就咨询 architect
      - 不得修改测试文件的断言来让测试通过
    prompt_stage: agent_coder
    tools: null
    may_consult: [architect]
    memory_scope: private
    timeout_s: 900

  - role: verifier
    display_name: 机械验证
    goal: 用确定性检查回答"到底干完了没有"
    mechanical: true
    prompt_stage: ""
    tools: []
    timeout_s: 300

  - role: auditor
    display_name: 审计员
    goal: 在机械检查通过之后，判断"干得对不对"
    backstory: 你只读代码，不改代码。发现问题时要判断是方案错还是实现错。
    constraints:
      - 不得修改任何文件
      - 每条发现都要指出具体文件和行号
      - 要明确区分"方案问题"和"实现问题"
    prompt_stage: agent_auditor
    tools: [read, grep, ls]
    may_consult: [architect, coder]
    memory_scope: private
    timeout_s: 300

stages:
  - name: plan
    role: architect
    expected_output: |
      结构化实现方案，含：① 要改的文件清单 ② 每个文件的改动要点
      ③ 可机械验证的验收标准（哪些测试要过、哪些命令要成功）
    output_key: plan
    verify_before_next: [goal_satisfied]
    next_on_success: implement
    next_on_failure: null
    max_retries: 1

  - name: implement
    role: coder
    expected_output: 按方案完成的代码改动 + 改动摘要
    context_keys: [plan]
    output_key: implementation
    verify_before_next: [diff_non_empty, files_exist, python_parses, lint_clean, goal_satisfied]
    audit_after_verify: true
    next_on_success: audit
    next_on_failure: implement
    max_retries: 2

  - name: audit
    role: auditor
    expected_output: |
      审计结论：通过 / 不通过。不通过时逐条列出问题，每条标注
      「方案问题」或「实现问题」，并给出文件和行号。
    context_keys: [plan, implementation]
    output_key: audit_report
    verify_before_next: [goal_satisfied]
    next_on_success: null
    next_on_failure: implement
    max_retries: 2

entry_stage: plan
total_token_budget: 500000
total_timeout_s: 1800
max_delegations: 20
