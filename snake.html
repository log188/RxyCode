<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑酷小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }
  .game-wrapper {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    background: #1a1a2e;
    cursor: pointer;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 8px 8px 8px;
    color: #e0e0e0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .hud .score {
    color: #f7d794;
    font-size: 22px;
  }
  .hud .hint {
    font-size: 13px;
    color: #aaa;
    font-weight: 400;
  }
  .game-over-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.7);
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .game-over-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .game-over-overlay h1 {
    color: #ff6b6b;
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255,107,107,0.5);
  }
  .game-over-overlay p {
    color: #ddd;
    font-size: 18px;
    margin-bottom: 20px;
  }
  .game-over-overlay .final-score {
    color: #f7d794;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .game-over-overlay .restart-btn {
    padding: 12px 40px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(245,87,108,0.4);
  }
  .game-over-overlay .restart-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 25px rgba(245,87,108,0.6);
  }
  .canvas-wrap {
    position: relative;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="hud">
    <span>🏃 跑酷</span>
    <span class="score">得分: <span id="scoreDisplay">0</span></span>
    <span class="hint">空格 / 点击 跳跃</span>
  </div>
  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="game-over-overlay" id="gameOverOverlay">
      <h1>游戏结束</h1>
      <p>你撞到了障碍物！</p>
      <div class="final-score">得分: <span id="finalScore">0</span></div>
      <button class="restart-btn" id="restartBtn">🔄 再来一次</button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const finalScore = document.getElementById('finalScore');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const restartBtn = document.getElementById('restartBtn');

  // ---------- 游戏常量 ----------
  const W = 800;
  const H = 400;
  const GROUND_Y = 340;        // 地面高度
  const PLAYER_W = 30;
  const PLAYER_H = 40;
  const PLAYER_X = 80;         // 固定水平位置

  // ---------- 物理参数 ----------
  const GRAVITY = 0.6;
  const JUMP_FORCE = -12;
  const MIN_JUMP_VEL = -6;     // 短按跳跃的最小速度（松开时限制）

  // ---------- 障碍物参数 ----------
  const OBSTACLE_W = 25;
  const OBSTACLE_H = 35;
  const OBSTACLE_SPEED = 5;
  const MIN_OBSTACLE_INTERVAL = 40;   // 帧数间隔（最小）
  const MAX_OBSTACLE_INTERVAL = 90;   // 帧数间隔（最大）

  // ---------- 游戏状态 ----------
  let player = { x: PLAYER_X, y: GROUND_Y - PLAYER_H, vy: 0, isJumping: false };
  let obstacles = [];
  let score = 0;
  let gameRunning = true;
  let frameCount = 0;
  let nextObstacleFrame = 60;   // 第一根障碍物出现的帧
  let animId = null;

  // ---------- 辅助函数 ----------
  function resetGame() {
    player = { x: PLAYER_X, y: GROUND_Y - PLAYER_H, vy: 0, isJumping: false };
    obstacles = [];
    score = 0;
    frameCount = 0;
    nextObstacleFrame = 60;
    gameRunning = true;
    gameOverOverlay.classList.remove('show');
    scoreDisplay.textContent = '0';
  }

  // ---------- 跳跃 ----------
  function jump() {
    if (!gameRunning) return;
    // 只有在地面才能跳跃
    if (player.y >= GROUND_Y - PLAYER_H - 1 && player.vy >= 0) {
      player.vy = JUMP_FORCE;
      player.isJumping = true;
    }
  }

  // ---------- 生成障碍物 ----------
  function spawnObstacle() {
    // 障碍物大小略有随机变化
    const w = OBSTACLE_W + (Math.random() * 10 - 5);
    const h = OBSTACLE_H + (Math.random() * 10 - 5);
    obstacles.push({
      x: W,
      y: GROUND_Y - h,
      w: w,
      h: h
    });
  }

  // ---------- 碰撞检测 (AABB) ----------
  function checkCollision(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  // ---------- 更新逻辑 ----------
  function update() {
    if (!gameRunning) return;

    // ---- 玩家物理 ----
    player.vy += GRAVITY;
    player.y += player.vy;

    // 地面碰撞
    if (player.y >= GROUND_Y - PLAYER_H) {
      player.y = GROUND_Y - PLAYER_H;
      player.vy = 0;
      player.isJumping = false;
    }

    // ---- 生成障碍物 ----
    frameCount++;
    if (frameCount >= nextObstacleFrame) {
      spawnObstacle();
      // 随机间隔生成下一根
      nextObstacleFrame = frameCount + MIN_OBSTACLE_INTERVAL +
        Math.floor(Math.random() * (MAX_OBSTACLE_INTERVAL - MIN_OBSTACLE_INTERVAL));
    }

    // ---- 障碍物移动 & 移除 ----
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= OBSTACLE_SPEED;
      if (obs.x + obs.w < 0) {
        obstacles.splice(i, 1);
        // 障碍物移出屏幕 -> 加分
        score++;
        scoreDisplay.textContent = score;
      }
    }

    // ---- 碰撞检测 ----
    const playerBox = { x: player.x, y: player.y, w: PLAYER_W, h: PLAYER_H };
    for (const obs of obstacles) {
      if (checkCollision(playerBox, obs)) {
        gameRunning = false;
        finalScore.textContent = score;
        gameOverOverlay.classList.add('show');
        break;
      }
    }
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ---- 背景 ----
    // 天空渐变
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, '#16213e');
    skyGrad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    // ---- 远处城市剪影 ----
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i < 12; i++) {
      const bx = (i * 70 + frameCount * 0.3) % (W + 100) - 50;
      const bh = 20 + Math.random() * 60;
      ctx.fillRect(bx, GROUND_Y - bh, 40, bh);
    }

    // ---- 地面 ----
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // 地面线
    ctx.strokeStyle = '#636e72';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();
    // 地面纹理 - 跑动指示线
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 20; i++) {
      const lx = (i * 45 + frameCount * 2) % (W + 40) - 20;
      ctx.beginPath();
      ctx.moveTo(lx, GROUND_Y + 5);
      ctx.lineTo(lx + 15, GROUND_Y + 5);
      ctx.stroke();
    }

    // ---- 障碍物 ----
    for (const obs of obstacles) {
      // 障碍物主体
      const grad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h);
      grad.addColorStop(0, '#e74c3c');
      grad.addColorStop(1, '#c0392b');
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(231,76,60,0.4)';
      ctx.shadowBlur = 10;
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.shadowBlur = 0;
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(obs.x + 4, obs.y + 4, obs.w * 0.3, 5);
      // 尖刺装饰
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w/2, obs.y - 8);
      ctx.lineTo(obs.x + obs.w/2 - 6, obs.y);
      ctx.lineTo(obs.x + obs.w/2 + 6, obs.y);
      ctx.closePath();
      ctx.fill();
    }

    // ---- 玩家 ----
    const px = player.x;
    const py = player.y;

    // 身体
    ctx.shadowColor = 'rgba(116,185,255,0.3)';
    ctx.shadowBlur = 15;
    const bodyGrad = ctx.createLinearGradient(px, py, px + PLAYER_W, py + PLAYER_H);
    bodyGrad.addColorStop(0, '#74b9ff');
    bodyGrad.addColorStop(1, '#0984e3');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(px, py, PLAYER_W, PLAYER_H, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 眼睛
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(px + 20, py + 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(px + 22, py + 12, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 嘴巴（跑步时开心表情）
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + 18, py + 22, 5, 0.1, Math.PI - 0.1);
    ctx.stroke();

    // 腿（动态）
    const legOffset = Math.sin(frameCount * 0.2) * 4;
    ctx.fillStyle = '#0984e3';
    ctx.fillRect(px + 4, py + PLAYER_H - 4, 7, 4 + legOffset);
    ctx.fillRect(px + 18, py + PLAYER_H - 4, 7, 4 - legOffset);

    // ---- 分数显示（画布上装饰） ----
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.font = 'bold 80px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🏃', W/2, 120);
  }

  // roundRect polyfill for canvas
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (r > w/2) r = w/2;
      if (r > h/2) r = h/2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };
  }

  // ---------- 游戏循环 ----------
  function gameLoop() {
    update();
    draw();
    animId = requestAnimationFrame(gameLoop);
  }

  // ---------- 事件绑定 ----------
  // 键盘
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });

  // 点击/触摸画布
  canvas.addEventListener('click', function() {
    jump();
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    jump();
  });

  // 重新开始按钮
  restartBtn.addEventListener('click', function() {
    resetGame();
  });

  // 按 R 键重启
  document.addEventListener('keydown', function(e) {
    if ((e.key === 'r' || e.key === 'R') && !gameRunning) {
      resetGame();
    }
  });

  // ---------- 启动游戏 ----------
  resetGame();
  gameLoop();
})();
</script>
</body>
</html>
