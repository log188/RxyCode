# Dev-mode update feed for electron-updater (Phase4-D7).
#
# Only used when running unpackaged (autoUpdater.forceDevUpdateConfig=true);
# packaged builds read the app-update.yml generated by electron-builder from
# electron-builder.yml's publish section. This file is excluded from packaged
# files (see electron-builder.yml files list).
#
# For local dev testing point RXYCODE_UPDATE_FEED_URL at a local generic feed
# (e.g. a directory served by `npx serve` or the update-feed smoke script);
# the placeholder URL below is never reachable and simply fails cleanly.
provider: generic
url: https://example.com/auto-updates
updaterCacheDirName: '@rxycodedesktop-app-updater'
